name: 定时同步 cloud-mail 上游

on:
  schedule:
    # 每周一北京时间 10:17（GitHub Actions 使用 UTC）
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: cloud-mail-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: 同步 maillab/cloud-mail
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.merge.outputs.updated }}
    steps:
      - name: 检出 fork 的 main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: 配置同步身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 拉取并合并上游 main
        id: merge
        run: |
          git remote add upstream https://github.com/maillab/cloud-mail.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "上游没有新提交，无需同步。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          fork_head=$(git rev-parse HEAD)

          # 以 upstream/main 为基底构造合并内容，但 .github/workflows/ 保留 fork 自己的版本。
          # 原因有二：
          #   1) GITHUB_TOKEN 没有 workflows 权限，若推送内容包含 .github/workflows/ 变更，
          #      GitHub 会直接拒绝推送（"without `workflows` permission"）；
          #   2) deploy-cloudflare.yml 含 fork 定制的部署配置闸门，不应被上游覆盖。
          git checkout -B sync-tmp upstream/main
          git checkout "$fork_head" -- .github/workflows/
          # 上游新增的 workflow 文件同样不引入（以 fork_head 为基准，
          # 只会命中上游有、fork 没有的文件，不会误删 fork 自有的 sync-upstream.yml）
          git diff --name-only --diff-filter=A "$fork_head" upstream/main -- .github/workflows/ \
            | while IFS= read -r f; do
                [ -n "$f" ] && git rm -f -- "$f"
              done
          git add .github/workflows/
          git commit --allow-empty -m "sync: keep fork .github/workflows"

          git checkout -B main "$fork_head"
          if ! git merge --no-edit sync-tmp; then
            conflicts=$(git diff --name-only --diff-filter=U | tr '\n' ', ')
            git merge --abort || true
            echo "::error::上游合并遇到冲突，已停止并保留 main。冲突文件：${conflicts:-无法自动合并}"
            exit 1
          fi

          git push origin HEAD:main
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "已将上游更新合并到 fork 的 main。" >> "$GITHUB_STEP_SUMMARY"

      - name: 有新代码时触发 Cloudflare 部署
        if: steps.merge.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN: ${{ secrets.DOMAIN || vars.DOMAIN }}
          ADMIN: ${{ secrets.ADMIN || vars.ADMIN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || vars.JWT_SECRET }}
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DOMAIN ADMIN JWT_SECRET; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "代码已同步；暂未部署。请配置仓库 Secrets 或 Variables：${missing[*]}。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh workflow run deploy-cloudflare.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "已提交 Cloudflare 部署工作流。" >> "$GITHUB_STEP_SUMMARY"
